id: yatraguard-monitor
namespace: yatraguard
description: |
  🚂 YatraGuard Flow 2: The 30-Minute Stateful Monitoring Mesh
  Runs every 30 minutes → Fetches LIVE train position from RapidAPI IRCTC
  → Sends localized status updates in English / Hindi / Marathi
  → Detects destination proximity → Fires PARALLEL safety alerts

tasks:
  - id: log_cycle_start
    type: io.kestra.plugin.core.log.Log
    message: "⏰ YatraGuard monitor cycle started at {{ now() }} IST"

  - id: monitor_all_active_journeys
    type: io.kestra.plugin.scripts.python.Script
    timeout: PT25M
    beforeCommands:
      - pip install psycopg2-binary kestra --quiet
    env:
      TWILIO_ACCOUNT_SID:   "your_twilio_account_sid_here"
      TWILIO_AUTH_TOKEN:    "your_twilio_auth_token_here"
      TWILIO_WHATSAPP_FROM: "whatsapp:+14155238886"
      RAPIDAPI_KEY:         "your_rapidapi_key_here"
      DB_HOST:              "host.docker.internal"
      DB_NAME:              "kestra"
      DB_USER:              "kestra"
      DB_PASSWORD:          "k3str4"
    script: |
      import json, os, urllib.request, urllib.parse, base64, psycopg2, time
      from kestra import Kestra

      TWILIO_SID   = os.environ['TWILIO_ACCOUNT_SID']
      TWILIO_TOK   = os.environ['TWILIO_AUTH_TOKEN']
      TWILIO_FROM  = os.environ['TWILIO_WHATSAPP_FROM']
      RAPIDAPI_KEY = os.environ['RAPIDAPI_KEY']
      DB_HOST      = os.environ['DB_HOST']
      DB_NAME      = os.environ['DB_NAME']
      DB_USER      = os.environ['DB_USER']
      DB_PASSWORD  = os.environ['DB_PASSWORD']

      # Interactive menu appended to every outbound message
      MENUS = {
          "English": (
              "\n\n━━━━━━━━━━━━━━━━━━━━\n"
              "📋 *Quick Commands*\n"
              "━━━━━━━━━━━━━━━━━━━━\n"
              "Reply *1* — 📍 Check current train status\n"
              "Reply *2* — 🛑 Stop tracking this journey\n"
              "Reply *3* — 🚨 Send emergency alert to family\n"
              "Reply *4* — 📞 Railway Helpline (139)\n"
              "Reply *5* — ℹ️ How does this work?\n"
              "Reply *6* — 💬 Ask family to call (Non-emergency)\n"
              "Reply *7* — 👮 Railway Police (RPF) Support\n"
              "Reply *8* — 🍔 Order Food (IRCTC eCatering)\n"
              "Reply *9* — 🎧 AI Storyteller (Next Station Fact)\n"
              "Reply *0* — 🎲 Pass the Time (Travel Games & Trivia)"
          ),
          "Hindi": (
              "\n\n━━━━━━━━━━━━━━━━━━━━\n"
              "📋 *त्वरित आदेश (Quick Commands)*\n"
              "━━━━━━━━━━━━━━━━━━━━\n"
              "*1* लिखें — 📍 ट्रेन की मौजूदा स्थिति देखें\n"
              "*2* लिखें — 🛑 ट्रैकिंग बंद करें\n"
              "*3* लिखें — 🚨 परिवार को आपातकालीन अलर्ट भेजें\n"
              "*4* लिखें — 📞 रेलवे हेल्पलाइन (139)\n"
              "*5* लिखें — ℹ️ यह कैसे काम करता है?\n"
              "*6* लिखें — 💬 परिवार को कॉल करने के लिए कहें\n"
              "*7* लिखें — 👮 रेलवे पुलिस (RPF) सहायता\n"
              "*8* लिखें — 🍔 खाना ऑर्डर करें (eCatering)\n"
              "*9* लिखें — 🎧 AI स्टोरीटेलर (अगले स्टेशन की कहानी)\n"
              "*0* लिखें — 🎲 टाइमपास (यात्रा खेल और पहेलियां)"
          ),
          "Marathi": (
              "\n\n━━━━━━━━━━━━━━━━━━━━\n"
              "📋 *त्वरित आदेश (Quick Commands)*\n"
              "━━━━━━━━━━━━━━━━━━━━\n"
              "*1* लिहा — 📍 ट्रेनची सध्याची स्थिती पाहा\n"
              "*2* लिहा — 🛑 ट्रॅकिंग थांबवा\n"
              "*3* लिहा — 🚨 कुटुंबाला आणीबाणी सूचना पाठवा\n"
              "*4* लिहा — 📞 रेल्वे हेल्पलाइन (139)\n"
              "*5* लिहा — ℹ️ हे कसे काम करते?\n"
              "*6* लिहा — 💬 कुटुंबाला कॉल करायला सांगा\n"
              "*7* लिहा — 👮 रेल्वे पोलीस (RPF) मदत\n"
              "*8* लिहा — 🍔 जेवण ऑर्डर करा (eCatering)\n"
              "*9* लिहा — 🎧 AI स्टोरीटेलर (पुढील स्टेशनची माहिती)\n"
              "*0* लिहा — 🎲 टाईमपास (प्रवास खेळ आणि कोडी)"
          ),
      }

      # Helpers
      def send_whatsapp(to_phone: str, message: str):
          import time
          time.sleep(1.5)  # Pace execution for Twilio rate limits
          
          url  = f"https://api.twilio.com/2010-04-01/Accounts/{TWILIO_SID}/Messages.json"
          auth = base64.b64encode(f"{TWILIO_SID}:{TWILIO_TOK}".encode()).decode()
          data = urllib.parse.urlencode({
              "From": TWILIO_FROM,
              "To":   f"whatsapp:+{to_phone}",
              "Body": message
          }).encode()
          req = urllib.request.Request(url, data=data, headers={
              "Authorization": f"Basic {auth}",
              "Content-Type":  "application/x-www-form-urlencoded"
          })
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  return json.loads(resp.read())
          except Exception as e:
              print(f"WhatsApp send error to {to_phone}: {e}")
              return None

      def get_live_train_status(train_number: str):
          """Query RapidAPI IRCTC live train status endpoint."""
          url = f"https://irctc1.p.rapidapi.com/api/v1/liveTrainStatus?trainNo={train_number}&startDay=1"
          req = urllib.request.Request(url, headers={
              "X-RapidAPI-Key":  RAPIDAPI_KEY,
              "X-RapidAPI-Host": "irctc1.p.rapidapi.com"
          })
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data = json.loads(resp.read())
                  if data.get('status') and data.get('data'):
                      return data['data']
                  return None
          except Exception as e:
              print(f"RapidAPI error for train {train_number}: {e}")
              return None

      def is_approaching_destination(data: dict, destination: str) -> bool:
          """Fuzzy match destination name against current/next station."""
          dest_lower = destination.lower().strip()
          try:
              current = data.get('currentStation', {}).get('stationName', '').lower()
              nxt     = data.get('nextStation',    {}).get('stationName', '').lower()
              for word in dest_lower.split():
                  if len(word) > 3 and (word in current or word in nxt):
                      return True
          except Exception:
              pass
          return False

      def build_status_message(language: str, train_number: str,
                               current_stn: str, next_stn: str, delay: int) -> str:
          delay_text = {
              "Hindi":   "समय पर ✅" if delay == 0 else f"{delay} मिनट देरी ⚠️",
              "Marathi": "वेळेत ✅"   if delay == 0 else f"{delay} मिनिट उशीर ⚠️",
              "English": "On time ✅" if delay == 0 else f"{delay} min late ⚠️",
          }.get(language, "On time ✅")

          msgs = {
              "Hindi": (
                  f"🚂 *YatraGuard अपडेट*\n\n"
                  f"ट्रेन *{train_number}* अभी *{current_stn}* के पास है।\n"
                  f"अगला स्टेशन: *{next_stn}*\n"
                  f"स्थिति: {delay_text}\n\n"
                  f"आराम करें, हम नज़र रख रहे हैं। 👀"
              ),
              "Marathi": (
                  f"🚂 *YatraGuard अपडेट*\n\n"
                  f"ट्रेन *{train_number}* आता *{current_stn}* जवळ आहे।\n"
                  f"पुढचे स्टेशन: *{next_stn}*\n"
                  f"स्थिती: {delay_text} 👀"
              ),
              "English": (
                  f"🚂 *YatraGuard Update*\n\n"
                  f"Train *{train_number}* is near *{current_stn}*.\n"
                  f"Next stop: *{next_stn}*\n"
                  f"Status: {delay_text} 👀"
              ),
          }
          menu = MENUS.get(language, MENUS["English"])
          return msgs.get(language, msgs["English"]) + menu

      def build_proximity_parent_alert(language: str, train_number: str,
                                       destination: str, delay: int) -> str:
          msgs = {
              "Hindi": (
                  f"🚨 *जागिए! स्टेशन आ गया!*\n\n"
                  f"ट्रेन *{train_number}* अब *{destination}* पहुंचने वाली है!\n\n"
                  f"⏰ अभी अपना सामान इकट्ठा करें!\n"
                  f"देरी: {'कोई नहीं' if delay==0 else str(delay)+' मिनट'}\n"
                  f"आपका परिवार स्टेशन आ रहा है। 🙏"
              ),
              "Marathi": (
                  f"🚨 *उठा! स्टेशन आले!*\n\n"
                  f"ट्रेन *{train_number}* आता *{destination}* येत आहे!\n\n"
                  f"⏰ सामान गोळा करा! कुटुंब येत आहे। 🙏"
              ),
              "English": (
                  f"🚨 *WAKE UP! Station approaching!*\n\n"
                  f"Train *{train_number}* is arriving at *{destination}*!\n\n"
                  f"⏰ Gather your luggage NOW.\n"
                  f"Family is heading to the station! 🙏"
              ),
          }
          return msgs.get(language, msgs["English"])

      # Main Monitoring Loop
      conn = psycopg2.connect(
          host=DB_HOST, port=5432,
          dbname=DB_NAME, user=DB_USER, password=DB_PASSWORD
      )
      cur = conn.cursor()

      # Tracks ACTIVE & ARRIVING journeys to prevent blindspot when train is delayed near station
      cur.execute("""
          SELECT id, train_number, parent_phone, family_phone, destination, language
          FROM yg_journeys
          WHERE status IN ('ACTIVE', 'ARRIVING')
      """)
      journeys = cur.fetchall()
      print(f"📋 Found {len(journeys)} active journey(s) to monitor.")

      journeys_processed    = 0
      proximity_alerts_sent = 0

      for journey in journeys:
          jid, train_no, parent_ph, family_ph, destination, language = journey
          lang = language if language in ("Hindi", "Marathi", "English") else "English"
          print(f"\n── Journey #{jid}: Train {train_no} → {destination} [{lang}] ──")

          train_data = get_live_train_status(train_no)

          if not train_data:
              print(f"  ⚠️ Could not fetch live data for train {train_no}. Skipping.")
              continue

          try:
              current_stn = train_data.get('currentStation', {}).get('stationName', 'Unknown')
              next_stn    = train_data.get('nextStation',    {}).get('stationName', 'Unknown')
              delay       = int(train_data.get('delay', 0) or 0)

              # Persist latest position to DB
              cur.execute(
                  """UPDATE yg_journeys
                     SET current_station=%s, next_station=%s, delay_mins=%s, last_updated=NOW()
                     WHERE id=%s""",
                  (current_stn, next_stn, delay, jid)
              )
              conn.commit()
              print(f"  📍 Current: {current_stn} | Next: {next_stn} | Delay: {delay} min")

              # PROXIMITY GATE
              if is_approaching_destination(train_data, destination):
                  print(f"  🚨 PROXIMITY ALERT for journey #{jid}!")

                  # 1) Wake-up alarm → parent (in their language)
                  parent_alert = build_proximity_parent_alert(lang, train_no, destination, delay)
                  send_whatsapp(parent_ph, parent_alert)

                  # 2) Pickup dispatch → family coordinator (always English)
                  family_alert = (
                      f"🚘 *PICKUP ALERT — YatraGuard*\n\n"
                      f"Train *{train_no}* is approaching *{destination}* station!\n\n"
                      f"⏰ Time to leave for pickup NOW.\n"
                      f"Delay: {'None' if delay==0 else str(delay)+' min'}\n\n"
                      f"Safe travels! 🙏"
                  )
                  send_whatsapp(family_ph, family_alert)

                  cur.execute("UPDATE yg_journeys SET status='ARRIVING' WHERE id=%s", (jid,))
                  conn.commit()
                  proximity_alerts_sent += 1
                  print(f"  ✅ Parallel proximity alerts fired!")

              else:
                  # REGULAR 30-MIN STATUS UPDATE
                  status_msg = build_status_message(lang, train_no, current_stn, next_stn, delay)
                  send_whatsapp(parent_ph, status_msg)
                  print(f"  ✅ Status + menu sent to {parent_ph}")

              journeys_processed += 1
              time.sleep(2)  # Avoid rate-limit between journeys

          except Exception as e:
              print(f"  ❌ Error on journey #{jid}: {e}")
              import traceback; traceback.print_exc()

      cur.close()
      conn.close()

      print(f"\n🏁 Cycle done. Processed: {journeys_processed} | Proximity: {proximity_alerts_sent}")
      Kestra.outputs({
          "journeys_processed":    str(journeys_processed),
          "proximity_alerts_sent": str(proximity_alerts_sent)
      })

  - id: log_cycle_done
    type: io.kestra.plugin.core.log.Log
    message: |
      ✅ Monitor cycle complete.
      Journeys processed    : {{ outputs.monitor_all_active_journeys.vars.journeys_processed }}
      Proximity alerts fired: {{ outputs.monitor_all_active_journeys.vars.proximity_alerts_sent }}

triggers:
  - id: every_30_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    timezone: Asia/Kolkata
