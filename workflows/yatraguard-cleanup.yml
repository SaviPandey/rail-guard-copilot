id: yatraguard-cleanup
namespace: yatraguard
description: |
  🚂 YatraGuard Flow 3: Daily Cleanup & Analytics
  Runs every day at 2 AM IST → Marks arrived journeys as COMPLETED
  → Expires stale journeys → Logs daily stats

tasks:
  - id: mark_completed_journeys
    type: io.kestra.plugin.jdbc.postgresql.Queries
    url: jdbc:postgresql://postgres:5432/kestra
    username: kestra
    password: k3str4
    sql: |
      -- Mark ARRIVING journeys as COMPLETED after 2 hours of no updates
      UPDATE yg_journeys
      SET status = 'COMPLETED'
      WHERE status = 'ARRIVING'
        AND last_updated < NOW() - INTERVAL '2 hours';

      -- Expire ACTIVE journeys older than 40 hours (max journey time)
      UPDATE yg_journeys
      SET status = 'EXPIRED'
      WHERE status = 'ACTIVE'
        AND started_at < NOW() - INTERVAL '40 hours';

  - id: fetch_daily_stats
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: jdbc:postgresql://postgres:5432/kestra
    username: kestra
    password: k3str4
    fetch: true
    sql: |
      SELECT
        status,
        COUNT(*) AS total,
        COUNT(DISTINCT parent_phone) AS unique_parents
      FROM yg_journeys
      GROUP BY status
      ORDER BY total DESC;

  - id: log_stats
    type: io.kestra.plugin.core.log.Log
    message: |
      📊 YatraGuard Daily Stats ({{ now() }}):
      {{ outputs.fetch_daily_stats | json }}

  - id: log_cleanup_done
    type: io.kestra.plugin.core.log.Log
    message: "🧹 YatraGuard daily cleanup complete!"

triggers:
  - id: daily_2am_ist
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *"
    timezone: Asia/Kolkata
